version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "excel-formula-beautifier"
        reason: "This is the project itself, not a published npm package"
    commit-message:
      prefix: "deps"
      include: "scope"